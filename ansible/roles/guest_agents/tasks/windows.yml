---
# Microsoft Windows specific tasks.

# ansible-lint: disable=line-length
# Tasks for installing Qemu guest agent.
- name: Print var as a debug message
  ansible.builtin.debug:
    var: ansible_facts

- name: Install Virtio Guest Tools
  block:
    - name: Locate virtio-win-guest-tools.exe
      ansible.windows.win_stat:
        path: "{{ item }}"
      loop:
        - D:\virtio-win-guest-tools.exe
        - E:\virtio-win-guest-tools.exe
        - F:\virtio-win-guest-tools.exe
      register: locate

    - name: Install Virtio Guest Tools
      ansible.windows.win_package:
        path: "{{ item.stat.path }}"
        arguments:
          - /install
          - /passive
          - /norestart
      when: item.stat.exists
      loop: "{{ locate.results }}"
      async: 60
      poll: 10

- name: Import Red Hat Certificate
  block:
    - name: Check if redhat.cer is already present on the system
      ansible.windows.win_stat:
        path: "{{ ansible_env.TEMP }}\\redhat.cer"
      register: redhat_cert

    - name: Locate virtio-win-guest-tools.exe
      ansible.windows.win_stat:
        path: "{{ item }}"
      loop:
        - D:\Balloon\2k22\amd64\blnsvr.exe
        - E:\Balloon\2k22\amd64\blnsvr.exe
        - F:\Balloon\2k22\amd64\blnsvr.exe
      register: locate

    - name: Get the redhat certificate from blnsvr.exe
      ansible.windows.win_powershell:
        script: |
          $cert = (Get-AuthenticodeSignature "{{ item.stat.path }}").SignerCertificate
          [System.IO.File]::WriteAllBytes("${env:TEMP}\redhat.cer", $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
      when: (item.stat.exists) and (not redhat_cert.stat.exists)
      loop: "{{ locate.results }}"

    - name: Add redhat.cer to TrustedPublisher store
      ansible.windows.win_certificate_store:
        path: "{{ ansible_env.TEMP }}\\redhat.cer"
        state: present
        store_name: TrustedPublisher
      when: redhat_cert.stat.exists

- name: Install Spice Tools
  block:
    - name: Install Spice Tools
      ansible.windows.win_package:
        path: https://www.spice-space.org/download/windows/spice-guest-tools/spice-guest-tools-latest.exe
        arguments:
          - /S
      async: 60
      poll: 10

- name: Start services
  block:
    - name: Start qemu-ga, spice-agent and vdservice service
      ansible.windows.win_service:
        name: "{{ item }}"
        start_mode: auto
        state: started
      loop:
        - qemu-ga
        - spice-agent
        - vdservice
      async: 60
      poll: 10

