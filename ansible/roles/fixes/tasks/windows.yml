---
# Microsoft Windows specific tasks.

# ansible-lint: disable=line-length
# Tasks for Password Expiration.
- name: Disable Password Expiration
  block:
    - name: Disable Local Administrator Password Expiration
      ansible.windows.win_user:
        name: Administrator
        password_never_expires: true

    - name: Disable Password Expiration for "{{ build_username }}"
      ansible.windows.win_user:
        name: "{{ build_username }}"
        password_never_expires: true

- name: Explorer customisations
  block:
    - name: Show file extensions in Explorer
      ansible.windows.win_regedit:
        path: HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: HideFileExt
        data: 0
        type: dword

    - name: Show Hidden Files in Explorer
      ansible.windows.win_regedit:
        path: HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: Hidden
        data: 1
        type: dword

# Tasks for fixes.
- name: Miscellaneous fixes
  block:
    - name: Set global EULA acceptance for SysInternals tools
      ansible.windows.win_regedit:
        path: HKCU:\Software\Sysinternals
        name: EulaAccepted
        data: 1
        type: dword

    - name: Enable QuickEdit Mode
      ansible.windows.win_regedit:
        path: HKCU:\Console
        name: QuickEdit
        data: 1
        type: dword

    - name: Disable UAC
      ansible.windows.win_regedit:
        path: HKLM:\Software\Microsoft\Windows\CurrentVersion\policies\system
        name: EnableLUA
        data: 0
        type: dword

    - name: Set the default shell for OpenSSH to powershell.exe
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\OpenSSH
        name: DefaultShell
        data: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        type: string

    - name: New Network Window Off
      ansible.windows.win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Network\NewNetworkWindowOff

    - name: Reset the autologon count
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
        name: AutoLogonCount
        data: 0
        type: dword

    # Allow ICMP ping in firewall
    - name: Firewall rule to allow ICMP v4 echo (ping)
      community.windows.win_firewall_rule:
        name: ICMP Allow incoming V4 echo request
        enabled: true
        state: present
        profiles:
          - domain
          - public
          - private
        action: allow
        direction: in
        protocol: icmpv4
        icmp_type_code:
          - '8:*'

    - name: Firewall rule to allow ICMP v6 echo (ping)
      community.windows.win_firewall_rule:
        name: ICMP Allow incoming V6 echo request
        enabled: true
        state: present
        profiles:
          - domain
          - public
          - private
        action: allow
        direction: in
        protocol: icmpv6
        icmp_type_code:
          - '8:*'

# Tasks for post setup.
- name: Miscellaneous fixes
  block:
    - name: Locate SetupComplete.cmd
      ansible.windows.win_stat:
        path: "{{ item }}"
      loop:
        - D:\SetupComplete.cmd
        - E:\SetupComplete.cmd
        - F:\SetupComplete.cmd
      register: locate

    - name: Create directory structure
      ansible.windows.win_file:
        path: C:\Windows\setup\scripts
        state: directory

    - name: Copy SetupComplete.cmd to destination
      ansible.windows.win_copy:
        src: "{{ item.stat.path }}"
        dest: C:\Windows\setup\scripts\SetupComplete.cmd
        remote_src: true
      when: item.stat.exists
      loop: "{{ locate.results }}"
